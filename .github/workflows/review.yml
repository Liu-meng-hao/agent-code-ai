name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# 同一 PR 多次 push 时，取消旧 run，只保留最新一次（防抖）
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 跳过 draft PR，以及带 skip-review 标签的 PR
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 提交 review 评论所需
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 拉取完整历史，保证能拿到 base/head 之间的 diff

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # 恢复按 PR 号隔离的增量审查缓存（记录已审查文件及其 blob hash）
      - name: Restore review cache
        uses: actions/cache@v5
        with:
          path: .ai-review-cache.json
          key: ai-review-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            ai-review-${{ github.event.pull_request.number }}-

      - name: Run AI review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./review